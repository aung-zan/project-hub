services:
  laravel_app:
    build:
      context: .
      dockerfile: backend/laravel-app/Dockerfile.dev
    container_name: laravel_app
    volumes:
      - ./backend/laravel-app:/var/www/html
    ports:
      - '9000:9000'
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: 'aungminzan'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'project_hub'
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./backend/laravel-app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel_app