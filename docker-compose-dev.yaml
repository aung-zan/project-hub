services:
  laravel_app:
    build:
      context: .
      dockerfile: backend/laravel-app/Dockerfile.dev
    container_name: laravel_app
    volumes:
      - ./backend/laravel-app:/var/www/html
    ports:
      - '9000:9000'
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: 'aungminzan'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'project_hub'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aungminzan -d project_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./backend/laravel-app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel_app
  api_gateway:
    build:
      context: ./backend/api_gateway
      dockerfile: Dockerfile.dev
    container_name: api_gateway
    ports:
      - '3000:3000'
    volumes:
      - ./backend/api_gateway:/app
      - /app/node_modules
    depends_on:
      - laravel_app
    command: >
      bash -c "
        if [ ! -f /app/.env ]; then
          cp .env.example .env &&
          npm install
        fi &&
        npm run dev
      "
